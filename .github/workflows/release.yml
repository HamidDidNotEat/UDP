# Builds UDP.zip and SHA256SUMS for every version tag (v*), which Get.ps1 downloads and verifies.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build UDP.zip
        # git archive honours .gitattributes: CRLF line endings, and export-ignore for files
        # that are not needed to run UDP.
        run: git archive --format=zip --output=UDP.zip HEAD

      - name: Write SHA256SUMS
        run: sha256sum UDP.zip > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" UDP.zip SHA256SUMS --title "UDP $GITHUB_REF_NAME" --generate-notes
