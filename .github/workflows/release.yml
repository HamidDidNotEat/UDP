# Publishes a GitHub release for every version tag (v*): UDP.zip, its SHA256SUMS (both used by
# Get.ps1) and release notes taken from the matching CHANGELOG.md section.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version in config/tools.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          configured="$(jq -r '.project.version' config/tools.json)"
          if [ "$version" != "$configured" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project.version $configured in config/tools.json" >&2
            exit 1
          fi

      - name: Build UDP.zip and SHA256SUMS
        # git archive honours .gitattributes: CRLF line endings, and export-ignore for files
        # that are not needed to run UDP.
        run: |
          git archive --format=zip --output=UDP.zip HEAD
          sha256sum UDP.zip > SHA256SUMS

      - name: Write the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          {
            echo
            echo "### Install"
            echo
            echo '```powershell'
            echo "irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/Get.ps1 | iex"
            echo '```'
            echo
            echo "Or download \`UDP.zip\`, extract it and run \`Run-UDP.bat\`. SHA256 of UDP.zip: \`$(cut -d ' ' -f 1 SHA256SUMS)\`"
          } >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" UDP.zip SHA256SUMS --title "Ultimate Debloat Pack $GITHUB_REF_NAME" --notes-file notes.md
